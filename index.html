<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PERCONA REBELS</title>
<meta name="description" content="PERCONA REBELS: freedom fighters for open source. A free 1980s-style arcade shooter from Percona.">
<meta name="theme-color" content="#0f0e13">
<link rel="icon" type="image/png" sizes="32x32" href="assets/rebels/icon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/rebels/icon-16.png">
<link rel="apple-touch-icon" href="assets/rebels/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="REBELS">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="application-name" content="PERCONA REBELS">
<style>
@import url("assets/fonts/fonts.css");
:root {
  --font-pixel: "Press Start 2P", "VT323", monospace;
  --font-mono: "VT323", ui-monospace, monospace;
  --accent: #653df4; --accent-2: #f6fe54; --accent-3: #22c1a5;
  --bg: #0f0e13; --bg-3: #201e28; --panel: rgba(20, 18, 28, 0.94);
  --line: rgba(255, 255, 255, 0.09); --line-strong: rgba(255, 255, 255, 0.22);
  --text: #f4f2f8; --text-dim: #a9a5b8; --text-faint: #6f6b7d;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: radial-gradient(ellipse at 50% 30%, #1d1542 0%, var(--bg) 58%, #07060b 100%);
  color: var(--text); font-family: var(--font-mono); overflow: hidden;
  touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
}
#scanlines { position: fixed; inset: 0; z-index: 0; pointer-events: none; background: repeating-linear-gradient(to bottom, transparent 0 2px, rgba(0, 0, 0, .22) 2px 4px); }
#stage {
  position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 1; line-height: 0; background: #000;
  box-shadow: 0 0 0 2px #1e1c26, 0 0 0 4px rgba(101, 61, 244, .35), 0 0 70px rgba(101, 61, 244, .45);
}
#stage canvas { display: block; width: 100%; height: 100%; image-rendering: crisp-edges; image-rendering: pixelated; }
#stage canvas[hidden] { display: none; }
#stage.crt-css { border-radius: 3.5% / 2.8%; overflow: hidden; }
#stage.crt-css::after {
  content: ""; position: absolute; inset: 0; pointer-events: none; border-radius: inherit;
  background:
    repeating-linear-gradient(to bottom, transparent 0, transparent calc(var(--px, 3px) * .62), rgba(0, 0, 0, .32) calc(var(--px, 3px) * .62), rgba(0, 0, 0, .32) var(--px, 3px)),
    radial-gradient(ellipse at center, transparent 58%, rgba(0, 0, 0, .6) 100%);
  box-shadow: inset 0 0 40px rgba(0, 0, 0, .7);
}
.back {
  position: fixed; left: 14px; top: 12px; z-index: 5; font-family: var(--font-pixel); font-size: 10px; letter-spacing: 1px;
  color: var(--accent-2); text-decoration: none; text-shadow: 2px 2px 0 var(--accent), 0 0 10px rgba(246, 254, 84, .4);
  padding: 8px 10px; border: 1px solid var(--line-strong); border-radius: 999px; background: rgba(15, 14, 19, .75);
}
.back:hover, .back:focus-visible { background: var(--accent); color: #fff; outline: none; }
body.public .back { display: none; }                                  /* public game: the way out only shows while paused */
body.public.paused .back { display: inline-block; animation: backIn .25s ease-out; box-shadow: 0 0 18px rgba(246, 254, 84, .45); }
@keyframes backIn { from { opacity: 0; transform: translateY(-6px); } }
@media (prefers-reduced-motion: reduce) { body.public.paused .back { animation: none; } }
.hints { position: fixed; left: 0; right: 0; bottom: 8px; z-index: 2; margin: 0; text-align: center; font-size: 18px; color: var(--text-faint); letter-spacing: .5px; padding: 0 12px; }
.hints kbd { font-family: var(--font-mono); color: var(--text); border: 1px solid var(--line-strong); border-radius: 4px; padding: 0 5px; }
.touchbar { position: fixed; right: 12px; top: 10px; z-index: 5; display: none; gap: 8px; }
.touchbar button { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line-strong); background: rgba(15, 14, 19, .75); color: var(--accent-2); font-family: var(--font-pixel); font-size: 12px; }
body.touch .touchbar { display: flex; }
.touchbar .quit { display: none; width: auto; padding: 0 12px; border-radius: 22px; font-size: 9px; color: #ff5c7a; }
body.paused .touchbar .quit { display: block; }
body.touch .hints { display: none; }
@media (max-height: 560px) { .hints { display: none; } }

/* events (?event=…): the event's logo on the left of the stage, the community sign-up QR code on the right */
.ev { position: fixed; top: 50%; z-index: 1; width: min(calc(var(--gutter, 0px) - 40px), 300px); transform: translate(-50%, -50%);
  display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; }
.ev[hidden], body:not(.wide) .ev { display: none; }
#event-logo { left: calc(var(--gutter, 0px) / 2); }
#event-qr { left: calc(100vw - var(--gutter, 0px) / 2); }
.ev .ev-k { font-family: var(--font-pixel); font-size: 11px; letter-spacing: 2px; color: var(--accent-3); }
.ev .ev-card { width: 100%; padding: 8%; background: #fff; border-radius: 16px; line-height: 0;
  box-shadow: 0 0 0 4px rgba(101, 61, 244, .55), 0 0 50px rgba(101, 61, 244, .5); }
.ev .ev-card img, .ev .ev-card canvas { width: 100%; height: auto; }
.ev .ev-card canvas { image-rendering: pixelated; }
.ev .ev-name { font-family: var(--font-pixel); font-size: clamp(12px, 1.4vw, 20px); line-height: 1.4; color: var(--accent-2); text-shadow: 3px 3px 0 var(--accent); overflow-wrap: anywhere; }
.ev .ev-sub { font-family: var(--font-pixel); font-size: clamp(9px, .9vw, 13px); line-height: 1.6; color: var(--text); }
/* phones: no room beside the game, so a strip under it: the logo, the event, a button to the sign-up page */
.ev-strip { position: fixed; left: 50%; bottom: 0; z-index: 3; width: min(96vw, 520px); height: var(--below, 0px); transform: translateX(-50%);
  display: none; flex-wrap: wrap; align-content: center; justify-content: center; align-items: center; gap: 8px 12px; padding: 6px 8px; text-align: center; }
body.event.strip .ev-strip:not([hidden]) { display: flex; }
.ev-strip img { height: clamp(24px, calc(var(--below, 0px) * .3), 56px); width: auto; padding: 4px; background: #fff; border-radius: 8px; }
.ev-strip .ev-k { font-family: var(--font-pixel); font-size: 9px; letter-spacing: 1px; color: var(--accent-3); }
.ev-strip .ev-name { font-family: var(--font-pixel); font-size: 12px; color: var(--accent-2); text-shadow: 2px 2px 0 var(--accent); }
.ev-strip .ev-join { flex-basis: 100%; font-family: var(--font-pixel); font-size: 9px; line-height: 1.6; letter-spacing: .5px; color: #fff; text-decoration: none;
  padding: 10px 12px; border-radius: 10px; background: var(--accent); box-shadow: 0 4px 0 #3d2494; touch-action: manipulation; }
.ev-strip .ev-join[hidden] { display: none; }
.ev .ev-url { font-size: 18px; color: var(--text-dim); overflow-wrap: anywhere; }

/* choose your pilot */
.pilot { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; background: rgba(7, 6, 11, .82); backdrop-filter: blur(3px); touch-action: auto; }
.pilot[hidden] { display: none; }
.pilot .box {
  width: min(760px, 94vw); max-height: min(88vh, 820px); display: flex; flex-direction: column; gap: 12px; padding: 18px;
  background: var(--panel); border: 2px solid var(--accent); border-radius: 14px; box-shadow: 0 0 0 4px rgba(101, 61, 244, .25), 0 0 60px rgba(101, 61, 244, .5);
}
.pilot h2 { margin: 0; font-family: var(--font-pixel); font-size: 14px; letter-spacing: 1px; color: var(--accent-2); text-shadow: 3px 3px 0 var(--accent); }
.pilot .sub { margin: 0; font-size: 18px; color: var(--text-dim); }
.pilot input {
  width: 100%; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--bg-3); color: var(--text);
  font: 22px var(--font-mono); outline: none; -webkit-user-select: text; user-select: text;
}
.pilot input:focus { border-color: var(--accent-2); }
.pgrid { flex: 1; min-height: 120px; overflow: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); gap: 8px; padding: 4px; }
.pc { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 4px; border-radius: 10px; border: 2px solid transparent; background: var(--bg-3); color: var(--text); cursor: pointer; font: 16px var(--font-mono); }
.pc img, .pc .ini { width: 56px; height: 56px; border-radius: 6px; border: 2px solid var(--c); image-rendering: pixelated; object-fit: cover; background: #000; }
.pc .ini { display: grid; place-items: center; font: 12px var(--font-pixel); color: #fff; background: linear-gradient(135deg, var(--accent), #2b1a6b); }
.pc .nm { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pc.on { border-color: var(--accent-2); box-shadow: 0 0 16px rgba(246, 254, 84, .45); transform: scale(1.04); }
.none { grid-column: 1 / -1; text-align: center; font-size: 20px; color: var(--text-dim); }
.pfoot { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
#pilot-info { flex: 1; min-width: 200px; display: flex; flex-direction: column; font-size: 18px; color: var(--text-dim); }
#pilot-info b { font-family: var(--font-pixel); font-size: 11px; line-height: 1.6; color: var(--text); font-weight: normal; }
.btn { font-family: var(--font-pixel); font-size: 10px; letter-spacing: 1px; padding: 12px 14px; border-radius: 10px; border: 2px solid var(--line-strong); background: var(--bg-3); color: var(--text); cursor: pointer; }
.btn:hover, .btn:focus-visible { border-color: var(--accent-2); outline: none; }
.btn.go { background: var(--accent); border-color: var(--accent-2); color: #fff; box-shadow: 0 5px 0 #3d2494; }
.btn.go:active { transform: translateY(3px); box-shadow: 0 2px 0 #3d2494; }
.pilot .keys { margin: 0; font-size: 16px; color: var(--text-faint); }
@media (prefers-reduced-motion: reduce) { .pc.on { transform: none; } }

/* play code, at events: a raffle ticket number or the code from the Percona Community welcome email */
.playcode .box { width: min(480px, 94vw); }
.playcode input { font: 30px var(--font-pixel); letter-spacing: 4px; text-align: center; padding: 16px 12px; }
.playcode .pc-msg { min-height: 1.3em; margin: 0; font-size: 20px; color: var(--accent-2); }
.playcode .pc-prize { margin: 0; font-family: var(--font-pixel); font-size: 10px; line-height: 1.6; color: var(--accent-3); }
.playcode .pc-prize:empty { display: none; }
.playcode .pfoot { justify-content: flex-end; }
.playcode .btn:disabled { opacity: .5; }
.playcode input.sure { border-color: var(--accent-2); color: var(--accent-2); background: #1d1a10; }
.playcode .pc-world { align-self: flex-start; text-decoration: none; color: var(--accent-2); }
.playcode .pc-world[hidden] { display: none; }
</style>
</head>
<body>
<div id="scanlines"></div>
<a class="back" id="back" href="https://www.percona.com" title="percona.com">◀ PERCONA.COM</a>
<div class="touchbar"><button type="button" id="t-quit" class="quit" aria-label="End this game (tap twice)">END</button><button type="button" id="t-pause" aria-label="Pause">II</button><button type="button" id="t-mute" aria-label="Sound on or off">♪</button></div>

<main id="stage" aria-label="PERCONA REBELS">
  <canvas id="view" width="224" height="288" role="img" aria-label="PERCONA REBELS game screen. Press Enter to insert a coin, Enter again to start. Arrow keys or WASD move, Space fires, P or Escape pauses, M toggles sound."></canvas>
  <canvas id="crt" width="224" height="288" hidden aria-hidden="true"></canvas>
</main>

<aside class="ev" id="event-logo" hidden aria-label="Event">
  <span class="ev-k">LIVE AT</span>
  <div class="ev-card"><img alt="" referrerpolicy="no-referrer" hidden></div>
  <span class="ev-name"></span>
</aside>
<aside class="ev-strip" id="event-strip" hidden aria-label="Event">
  <img alt="" referrerpolicy="no-referrer" hidden>
  <span><span class="ev-k">LIVE AT</span> <span class="ev-name"></span></span>
  <a class="ev-join" target="_blank" rel="noopener" hidden></a>
</aside>
<aside class="ev" id="event-qr" hidden aria-label="Join the Percona Community">
  <span class="ev-k">JOIN THE REBELLION</span>
  <div class="ev-card ev-code"></div>
  <span class="ev-sub">SCAN TO JOIN THE PERCONA COMMUNITY</span>
  <span class="ev-name">AND ENTER THE RAFFLE</span>
  <span class="ev-url"></span>
</aside>

<p class="hints"><kbd>←</kbd><kbd>→</kbd> / <kbd>WASD</kbd> move · <kbd>Space</kbd> fire · <kbd>Enter</kbd> coin + start · <kbd>P</kbd> / <kbd>Esc</kbd> pause · <kbd>M</kbd> sound · <kbd>C</kbd> CRT · gamepad and touch work too</p>

<section class="pilot playcode" id="playcode" hidden aria-label="Insert token: your play code">
  <div class="box">
    <h2>INSERT TOKEN</h2>
    <p class="sub" id="pc-sub"></p>
    <input id="pc-in" type="text" inputmode="numeric" autocomplete="off" spellcheck="false" maxlength="20" placeholder="0000000" aria-label="Play code">
    <p class="pc-msg" id="pc-msg" role="status" aria-live="polite"></p>
    <p class="pc-prize" id="pc-prize"></p>
    <a class="btn pc-world" id="pc-world" hidden>Play the world game instead ▶</a>
    <div class="pfoot">
      <button type="button" class="btn" id="pc-back">◀ Back</button>
      <button type="button" class="btn go" id="pc-go">INSERT ▶</button>
    </div>
    <p class="keys" id="pc-how"></p>
  </div>
</section>

<script>window.REBELS_STANDALONE=true;window.REBELS_ASSETS={};window.REBELS_BACK_NAME="percona.com";window.REBELS_PUBLIC=true;window.REBELS_LEADERBOARD="https://script.google.com/macros/s/AKfycbwtEBTAOFm1UpEh0H80ZuPRmxcjf3CAXliA7P28Bb83FgYcgBWYnwdFpfhSx85f4mxAZw/exec";window.REBELS_SW="sw.js";window.REBELS_MANIFEST_URL="manifest.webmanifest";</script>
<script src="rebels.js"></script>
</body>
</html>
